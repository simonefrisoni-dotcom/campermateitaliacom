[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "https://campermateitalia.com/*"
  to = "https://www.campermateitalia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200
